
name: ros2

on:
  push:
    branches: [ rolling-devel ]
  pull_request:
    branches: [ rolling-devel ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ros2 ${{ matrix.ros_distro }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ros_distro: [rolling]
        include:
        - ros_distro: rolling
          skip_keys: '' # skip keys shoudl be empty when release on ROSDISTRO_devel branch, comment these keys in the appriopriate package.
          # nav2, velodyne and grid_map_ros are not available on rolling, they are commented in the appropriate packages
          # and rtabmap_costmap_plugins is ignored (COLCON_IGNORE).
          # Listed packages are built with their dependencies, but only listed packages are tested.
          packages: 'rtabmap_ros rtabmap_conversions rtabmap_odom rtabmap_slam rtabmap_sync rtabmap_util rtabmap_python'
      fail-fast: false
    container:
      image: osrf/ros:${{ matrix.ros_distro }}-desktop-full
    steps:   
    - uses: actions/checkout@v4
    - uses: ros-tooling/setup-ros@v0.7
      with:
        required-ros-distributions: ${{ matrix.ros_distro }}
        use-ros2-testing: true # Rolling packages are only available on ros2-testing (the osrf/ros rolling image already uses it)
    - run: |
        DEBIAN_FRONTEND=noninteractive
        sudo apt update
        sudo apt upgrade -y
    - run: |
        echo "repositories:\n  introlab/rtabmap:\n    type: git\n    url: https://github.com/introlab/rtabmap.git\n    version: rolling-devel\n" > /tmp/deps.repos &&\
        cat /tmp/deps.repos
    - uses: ros-tooling/action-ros-ci@v0.4
      with:
        package-name: ${{ matrix.packages }}
        target-ros2-distro: ${{ matrix.ros_distro }}
        vcs-repo-file-url: /tmp/deps.repos
        rosdep-check: true
        rosdep-skip-keys: "${{ matrix.skip_keys }}"
